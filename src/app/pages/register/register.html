<div class="auth-page">
  <div class="auth-card register-card">
    <div class="brand-logo">
      <img src="/logo.png" alt="VISTA" class="logo-img">
    </div>
    
    <div class="auth-header">
      <h2>Tạo tài khoản mới</h2>
      <p>Đăng ký để trải nghiệm tư vấn AI</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="inputs-container">
        <div class="form-group">
          <div class="input-wrapper">
            <i class="ph ph-user"></i>
            <input type="text" name="fullName" [(ngModel)]="fullName" placeholder="Nguyễn Văn A" required>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="ph ph-envelope"></i>
            <input type="email" name="email" [(ngModel)]="email" placeholder="example@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="ph ph-phone"></i>
            <input type="text" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="0901 234 567" required>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper" style="position: relative;">
            <i class="ph ph-lock"></i>
            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Mật khẩu (Tối thiểu 8 ký tự)" required style="padding-right: 40px;">
            
            <i class="ph toggle-eye" 
               [ngClass]="showPassword ? 'ph-eye' : 'ph-eye-closed'" 
               (click)="showPassword = !showPassword"
               style="position: absolute; left: auto; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748B; font-size: 20px;">
            </i>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper" style="position: relative;">
            <i class="ph ph-check-circle"></i>
            <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Xác nhận mật khẩu" required style="padding-right: 40px;">
            
            <i class="ph toggle-eye" 
               [ngClass]="showConfirmPassword ? 'ph-eye' : 'ph-eye-closed'" 
               (click)="showConfirmPassword = !showConfirmPassword"
               style="position: absolute; left: auto; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748B; font-size: 20px;">
            </i>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-submit">Đăng ký</button>
    </form>

    <div class="auth-footer">
      <p>Đã có tài khoản? <a routerLink="/login">Đăng nhập</a></p>
    </div>
  </div>
</div>
