<div class="auth-page">
  <div class="auth-card reset-card">
    <div class="brand-logo">
      <img src="/logo.png" alt="VISTA" class="logo-img">
    </div>
    
    <div class="auth-header">
      <h2>Đặt mật khẩu mới</h2>
      <p>Mật khẩu mới phải khác mật khẩu cũ để bảo mật</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="inputs-container">
        <div class="form-group">
          <div class="input-wrapper" style="position: relative;">
            <i class="ph ph-lock"></i>
            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Mật khẩu mới (Tối thiểu 8 ký tự)" required style="padding-right: 40px;">
            
            <i class="ph toggle-eye" 
               [ngClass]="showPassword ? 'ph-eye' : 'ph-eye-closed'" 
               (click)="showPassword = !showPassword"
               style="position: absolute; left: auto; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748B; font-size: 20px;">
            </i>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper" style="position: relative;">
            <i class="ph ph-check-circle"></i>
            <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Xác nhận mật khẩu mới" required style="padding-right: 40px;">
            
            <i class="ph toggle-eye" 
               [ngClass]="showConfirmPassword ? 'ph-eye' : 'ph-eye-closed'" 
               (click)="showConfirmPassword = !showConfirmPassword"
               style="position: absolute; left: auto; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748B; font-size: 20px;">
            </i>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-submit">Xác nhận đổi mật khẩu</button>
    </form>
  </div>
</div>
