<div class="auth-page">
  <div class="auth-card verify-card">
    <div class="brand-logo">
      <img src="/logo.png" alt="VISTA" class="logo-img">
    </div>
    
    <div class="auth-header">
      <h2>Xác thực tài khoản</h2>
      <p>Mã xác minh đã được gửi đến: <strong>{{ email }}</strong></p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="inputs-container">
        <div class="form-group">
          <div class="input-wrapper">
            <i class="ph ph-keyhole"></i>
            <input type="text" name="otpCode" [(ngModel)]="otpCode" placeholder="Nhập mã 6 chữ số" maxLength="6" required style="text-align: center; letter-spacing: 4px; font-weight: 600;">
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Xác nhận mã</button>
    </form>

    <div class="auth-footer">
      <p>Không nhận được mã? <a href="javascript:void(0)">Gửi lại mã</a></p>
    </div>
  </div>
</div>
