<div class="auth-page">
  <div class="auth-card forgot-card">
    <div class="brand-logo">
      <img src="/logo.png" alt="VISTA" class="logo-img">
    </div>
    
    <div class="auth-header">
      <h2>Quên mật khẩu?</h2>
      <p>Nhập email để nhận mã xác thực đặt lại mật khẩu</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="inputs-container">
        <div class="form-group">
          <div class="input-wrapper">
            <i class="ph ph-envelope"></i>
            <input type="email" name="email" [(ngModel)]="email" placeholder="example@gmail.com" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Gửi mã xác nhận</button>
    </form>

    <div class="auth-footer">
      <p><a routerLink="/login"><i class="ph ph-arrow-left"></i> Quay lại Đăng nhập</a></p>
    </div>
  </div>
</div>
