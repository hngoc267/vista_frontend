<nav class="navbar">
  <div class="navbar-container">
    
    <div class="nav-left">
      <a routerLink="/" class="navbar-logo">
        <img src="/logo.png" alt="VISTA" height="44">
      </a>

      <div class="category-dropdown">
        <div class="dropdown-trigger">
          <i class="ph ph-list"></i>
          <span>Danh mục sản phẩm</span>
          <i class="ph ph-caret-down arrow-icon"></i>
        </div>
        <ul class="dropdown-menu">
          <li *ngFor="let category of categories">
            <a routerLink="/products" [queryParams]="{category: category.Category_id}">
              {{ category.Category_name }}
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="nav-center greeting-wrapper">
      <div class="greeting-text">
        <span *ngIf="isLoggedIn">
          ✨ <strong>{{ userName }}</strong> ơi, khám phá thiết bị hoàn hảo cùng VISTA nhé! ✨
        </span>
      </div>
      
      <div class="petals-container">
        <span class="petal">🌸</span>
        <span class="petal">🌸</span>
        <span class="petal">🌸</span>
        <span class="petal">🌸</span>
      </div>
    </div>

    <div class="nav-right">
      <a routerLink="/cart" class="action-btn cart-action">
        <span class="cart-icon-wrap">
          <i class="ph ph-shopping-cart"></i>
          <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
        </span>
        <span>Giỏ hàng</span>
      </a>

      <a *ngIf="!isLoggedIn" routerLink="/login" class="action-btn">
        <i class="ph ph-user"></i>
        <span>Đăng nhập</span>
      </a>
      
      <div *ngIf="isLoggedIn" class="profile-dropdown">
        <a class="action-btn profile-trigger" style="cursor: pointer;">
          <i class="ph ph-user"></i>
          <span>{{ userName || 'Tài khoản' }}</span>
          <i class="ph ph-caret-down" style="font-size: 12px; margin-left: 2px;"></i>
        </a>

        <ul class="profile-menu">
          <li>
            <a routerLink="/profile">
              <i class="ph ph-user-circle"></i>
              <span>Hồ sơ cá nhân</span>
            </a>
          </li>
          <li>
            <a routerLink="/order-history">
              <i class="ph ph-clock-counter-clockwise"></i>
              <span>Lịch sử đơn hàng</span>
            </a>
          </li>
          <li>
            <a routerLink="/voucher">
              <i class="ph ph-ticket"></i>
              <span>Mã giảm giá của tôi</span>
            </a>
          </li>
          
          </ul>
      </div>

      <a href="#" class="action-btn">
        <i class="ph ph-robot"></i>
        <span>AI Assistant</span>
      </a>
    </div>

  </div>
</nav>
