<div class="bell" [class.bell--dark]="variant === 'dark'">
  <button
    class="bell-button"
    type="button"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="unreadCount ? 'Thông báo, ' + unreadCount + ' chưa đọc' : 'Thông báo'"
    title="Thông báo"
    (click)="toggle()"
  >
    <svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
    </svg>
    <span class="bell-badge" *ngIf="unreadCount > 0">{{ badgeText }}</span>
  </button>

  <div class="panel" *ngIf="isOpen" role="dialog" aria-label="Danh sách thông báo">
    <div class="panel-header">
      <strong>Thông báo</strong>
      <button
        class="panel-link"
        type="button"
        [disabled]="unreadCount === 0"
        (click)="markAllAsRead()"
      >
        Đánh dấu đã đọc tất cả
      </button>
    </div>

    <ul class="panel-list" *ngIf="items.length; else emptyState">
      <li *ngFor="let item of items; trackBy: trackById">
        <button
          class="panel-item"
          type="button"
          [class.panel-item--unread]="!item.isRead"
          [class.panel-item--urgent]="item.priority === 'urgent'"
          (click)="open(item)"
        >
          <span class="item-dot" aria-hidden="true"></span>
          <span class="item-body">
            <span class="item-header-meta" *ngIf="(item.priority && item.priority !== 'normal') || item.status">
              <span
                class="badge badge--priority"
                [class.badge--urgent]="item.priority === 'urgent'"
                [class.badge--important]="item.priority === 'important'"
                *ngIf="item.priority && item.priority !== 'normal'"
              >
                {{ getPriorityLabel(item.priority) }}
              </span>
              <span
                class="badge badge--status"
                [class.badge--acknowledged]="item.status === 'acknowledged'"
                [class.badge--sent]="item.status === 'sent'"
                *ngIf="item.status"
              >
                {{ getStatusLabel(item.status) }}
              </span>
            </span>

            <span class="item-title">{{ item.title }}</span>
            <span class="item-message">{{ item.message }}</span>

            <span class="item-footer">
              <span class="item-sender" *ngIf="item.senderName">Gửi bởi: {{ item.senderName }}</span>
              <span class="item-time">{{ timeAgo(item.createdAt) }}</span>
            </span>

            <span class="item-action-row" *ngIf="item.status === 'sent'">
              <span
                class="btn-ack"
                role="button"
                tabindex="0"
                (click)="acknowledge($event, item)"
                (keydown.enter)="acknowledge($event, item)"
                (keydown.space)="acknowledge($event, item)"
                title="Xác nhận bạn đã tiếp nhận thông báo vận hành này"
              >
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Xác nhận tiếp nhận</span>
              </span>
            </span>
          </span>
        </button>
      </li>
    </ul>

    <ng-template #emptyState>
      <div class="panel-empty">Chưa có thông báo nào</div>
    </ng-template>
  </div>
</div>

<div
  class="toast"
  *ngIf="toast"
  [class.toast--urgent]="toast.priority === 'urgent'"
  [class.toast--important]="toast.priority === 'important'"
  role="status"
  aria-live="polite"
>
  <button class="toast-body" type="button" (click)="open(toast)">
    <div class="toast-meta" *ngIf="(toast.priority && toast.priority !== 'normal') || toast.senderName">
      <span
        class="badge badge--priority"
        [class.badge--urgent]="toast.priority === 'urgent'"
        [class.badge--important]="toast.priority === 'important'"
        *ngIf="toast.priority && toast.priority !== 'normal'"
      >
        {{ getPriorityLabel(toast.priority) }}
      </span>
      <span class="toast-sender" *ngIf="toast.senderName">từ {{ toast.senderName }}</span>
    </div>
    <span class="toast-title">{{ toast.title }}</span>
    <span class="toast-message">{{ toast.message }}</span>
  </button>
  <button class="toast-close" type="button" aria-label="Đóng thông báo" (click)="hideToast()">×</button>
</div>
