<div
  class="admin-layout"
  [class.sidebar-collapsed]="isSidebarCollapsed"
>
  <aside class="admin-sidebar">
    <a class="sidebar-brand" routerLink="/admin/dashboard">
      <span class="brand-logo">V</span>

      <span class="brand-text">
        <strong>VISTA</strong>
        <span>Cổng quản trị</span>
      </span>
    </a>

    <div class="sidebar-section-title">
      QUẢN TRỊ HỆ THỐNG
    </div>

    <nav class="sidebar-menu" aria-label="Menu quản trị">
      <a
        *ngFor="let item of menuItems"
        class="menu-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [title]="item.label"
      >
        <ng-icon
          class="menu-icon"
          [name]="item.icon"
          [size]="'20px'"
          strokeWidth="1.8"
        ></ng-icon>

        <span class="menu-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-bottom" #sidebarAccount>
      <button
        #sidebarAccountMenuTrigger
        class="sidebar-account-trigger"
        type="button"
        aria-haspopup="menu"
        [attr.aria-expanded]="isAccountMenuOpen && accountMenuPlacement === 'sidebar'"
        aria-controls="admin-account-menu"
        [attr.aria-label]="'Tài khoản ' + accountName + ', vai trò ' + accountRole"
        (click)="toggleAccountMenu('sidebar')"
      >
        <span class="admin-avatar" aria-hidden="true">{{ accountInitial }}</span>

        <span class="admin-info">
          <strong>{{ accountName }}</strong>
          <span>{{ accountRole }}</span>
        </span>

        <ng-icon
          class="account-menu-chevron"
          name="lucideChevronDown"
          [size]="'16px'"
          strokeWidth="1.8"
          aria-hidden="true"
        ></ng-icon>
      </button>

      <div
        #accountMenu
        *ngIf="isAccountMenuOpen"
        id="admin-account-menu"
        class="account-menu"
        [class.header-account-menu]="accountMenuPlacement === 'header'"
        role="menu"
        aria-label="Menu tài khoản"
      >
        <button
          class="account-menu-item"
          type="button"
          role="menuitem"
          (click)="goToChangePassword()"
        >
          <ng-icon name="lucideKeyRound" [size]="'18px'" aria-hidden="true"></ng-icon>
          <span>Đổi mật khẩu</span>
        </button>

        <button
          class="account-menu-item"
          type="button"
          role="menuitem"
          (click)="logout()"
        >
          <ng-icon name="lucideLogOut" [size]="'18px'" aria-hidden="true"></ng-icon>
          <span>Đăng xuất</span>
        </button>
      </div>

    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <button
          class="sidebar-toggle"
          type="button"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="!isSidebarCollapsed"
          aria-label="Thu gọn hoặc mở rộng thanh điều hướng"
          title="Thu gọn hoặc mở rộng menu"
        >
          <ng-icon
            name="lucideMenu"
            [size]="'20px'"
            strokeWidth="1.8"
          ></ng-icon>
        </button>

        <div class="header-breadcrumb">
          <ng-container
            *ngFor="let breadcrumb of breadcrumbs; let first = first; let last = last"
          >
            <span *ngIf="!first" class="breadcrumb-separator">›</span>
            <a
              *ngIf="breadcrumb.url && !last"
              class="breadcrumb-parent"
              [routerLink]="breadcrumb.url"
            >
              {{ breadcrumb.label }}
            </a>
            <span
              *ngIf="!breadcrumb.url || last"
              [class.breadcrumb-parent]="!last"
              [class.breadcrumb-current]="last"
              [attr.aria-current]="last ? 'page' : null"
            >
              {{ breadcrumb.label }}
            </span>
          </ng-container>
        </div>
      </div>

      <div class="header-actions">
        <app-notification-bell
          [token]="adminToken"
          variant="light"
        ></app-notification-bell>

        <button
          class="account-button"
          type="button"
          #headerAccountMenuTrigger
          title="Mở menu tài khoản"
          aria-haspopup="menu"
          [attr.aria-expanded]="isAccountMenuOpen && accountMenuPlacement === 'header'"
          aria-controls="admin-account-menu"
          [attr.aria-label]="'Tài khoản ' + accountName + ', vai trò ' + accountRole"
          (click)="toggleAccountMenu('header')"
        >
          <span class="header-avatar" aria-hidden="true">{{ accountInitial }}</span>

          <span class="account-info">
            <strong>{{ accountName }}</strong>
            <span>{{ accountRole }}</span>
          </span>

          <ng-icon
            class="account-chevron"
            name="lucideChevronDown"
            [size]="'16px'"
            strokeWidth="1.8"
            aria-hidden="true"
          ></ng-icon>
        </button>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="admin-footer">
      <span>VISTA Admin Portal</span>
      <span>© 2026 VISTA</span>
    </footer>
  </div>
</div>
